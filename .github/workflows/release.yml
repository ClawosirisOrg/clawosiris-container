name: Release OpenClaw Container

on:
  workflow_dispatch:
    inputs:
      openclaw_ref:
        description: OpenClaw git ref to build from
        required: true
        default: main
        type: string
      version_tag:
        description: Version tag to publish, for example 0.1.0
        required: true
        type: string
      latest:
        description: Also publish the latest tag
        required: true
        default: false
        type: boolean
      openclaw_install_browser:
        description: Set to true to pass OPENCLAW_INSTALL_BROWSER
        required: true
        default: true
        type: boolean
      openclaw_docker_apt_packages:
        description: Space-delimited apt packages
        required: true
        default: android-tools-adb build-essential ffmpeg fontconfig gh ghostscript imagemagick jq pandoc pipx ripgrep rsync ssh sudo tesseract-ocr texlive-latex-base time tmux usbutils weasyprint xsltproc
        type: string
      openclaw_extensions:
        description: Comma-delimited extension list
        required: true
        default: acpx,active-memory,arcee,brave,browser,codex,document-extract,file-transfer,memory-core,signal,whatsapp
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/clawosirisorg/openclaw

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout orchestration repo
        uses: actions/checkout@v4

      - name: Checkout OpenClaw source
        uses: actions/checkout@v4
        with:
          repository: ClawosirisOrg/openclaw
          ref: ${{ inputs.openclaw_ref }}
          path: openclaw

      - name: Capture OpenClaw commit
        id: source
        working-directory: ./openclaw
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: prep
        run: |
          TAGS="${IMAGE_NAME}:${{ inputs.version_tag }},${IMAGE_NAME}:sha-${{ steps.source.outputs.sha }}"
          if [ "${{ inputs.latest }}" = "true" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./openclaw
          file: ./openclaw/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.prep.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=OpenClaw container image
            io.clawosiris.openclaw.ref=${{ inputs.openclaw_ref }}
            io.clawosiris.openclaw.sha=${{ steps.source.outputs.sha }}
          build-args: |
            OPENCLAW_INSTALL_BROWSER=${{ inputs.openclaw_install_browser }}
            OPENCLAW_DOCKER_APT_PACKAGES=${{ inputs.openclaw_docker_apt_packages }}
            OPENCLAW_EXTENSIONS=${{ inputs.openclaw_extensions }}
