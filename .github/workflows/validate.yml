name: Validate Container Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate container (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            cache_scope: validate-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            cache_scope: validate-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout orchestration repo
        uses: actions/checkout@v4

      - name: Checkout OpenClaw source
        uses: actions/checkout@v4
        with:
          repository: ClawosirisOrg/openclaw
          ref: main
          path: openclaw

      - name: Prepare Clawosiris Dockerfile
        run: ./scripts/prepare-dockerfile.sh ./openclaw/Dockerfile ./openclaw/Dockerfile.clawosiris

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build validation image
        uses: docker/build-push-action@v6
        with:
          context: ./openclaw
          file: ./openclaw/Dockerfile.clawosiris
          push: false
          load: false
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          build-args: |
            OPENCLAW_INSTALL_BROWSER=true
            OPENCLAW_DOCKER_APT_PACKAGES=android-tools-adb build-essential ffmpeg fontconfig gh ghostscript imagemagick jq pandoc pipx podman ripgrep rsync ssh sudo tesseract-ocr texlive-latex-base time tmux usbutils weasyprint xsltproc
            OPENCLAW_EXTENSIONS=acpx,active-memory,arcee,brave,browser,codex,document-extract,file-transfer,llama-cpp,matrix,memory-core,signal,whatsapp
